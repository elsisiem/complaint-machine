services:
  - type: web
    name: complaint-machine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: NOVITA_API_KEY
        sync: false
      - key: ACTIONLAYER_API_KEY
        sync: false
      - key: TRUST_PROXY
        value: "1"
